<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="#3B82F6" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#3B82F6" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#3B82F6" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#3B82F6" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="#3B82F6" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#3B82F6" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#3B82F6" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#3B82F6" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#3B82F6" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#3B82F6" stroke-width="1"/>
  </g>

  <!-- Glow blobs -->
  <circle cx="950" cy="150" r="200" fill="url(#glow1)"/>
  <circle cx="200" cy="500" r="180" fill="url(#glow1)"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Logo mark (left) -->
  <g transform="translate(100, 215)">
    <rect width="200" height="200" rx="44" fill="#111827" stroke="#3B82F6" stroke-width="2" opacity="0.9"/>
    <rect x="16" y="16" width="168" height="168" rx="36" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
    <text x="100" y="108" font-family="Sora, Arial, sans-serif" font-size="120" font-weight="800"
          text-anchor="middle" dominant-baseline="central" fill="url(#letter)" filter="url(#textGlow)">H</text>
    <circle cx="100" cy="172" r="4" fill="#3B82F6"/>
  </g>

  <!-- Text content (right) -->
  <g transform="translate(360, 180)">
    <!-- Eyebrow -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#3B82F6" fill-opacity="0.1" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="20" cy="18" r="3" fill="#60A5FA"/>
    <text x="36" y="24" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#60A5FA" letter-spacing="2">PORTFOLIO</text>

    <!-- Name -->
    <text x="0" y="100" font-family="Sora, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">Muhammad</text>
    <text x="0" y="168" font-family="Sora, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#letter)">Hasnain</text>

    <!-- Role -->
    <text x="0" y="225" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" fill="#93C5FD">Full Stack Developer</text>
    <text x="260" y="225" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="400" fill="#6B7280">• AI App Developer</text>

    <!-- Tagline -->
    <text x="0" y="285" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#9CA3AF">Building scalable websites, AI apps, mobile apps &amp; digital experiences.</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>

  <!-- Bottom right url -->
  <text x="1140" y="595" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#6B7280" text-anchor="end">hasnainabdi.space-z.ai</text>
</svg>
